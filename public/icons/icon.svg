<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10131B"/>
      <stop offset="1" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A7F1FF"/>
      <stop offset=".42" stop-color="#20C8FF"/>
      <stop offset="1" stop-color="#1769FF"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#E8FCFF" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#56DFFF" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#087BFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#087BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="112" fill="url(#core)"/>

