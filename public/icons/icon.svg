    <rect x="111" y="363" width="34" height="5" rx="2.5" transform="rotate(-45 128 366)"/>
  </g>

  <!-- Firma original de HABITS: progreso ascendente -->
  <path d="M127 304L204 227L263 277L330 184L390 240" fill="none" stroke="url(#energy)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M127 355L204 278L263 328L330 235L390 291" fill="none" stroke="#F2FCFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".96"/>
